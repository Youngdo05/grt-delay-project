name: Collect GRT realtime data

on:
  schedule:
    # GitHub throttles high-frequency cron heavily (observed 2026-07-14:
    # a */10 schedule fired roughly hourly). So instead: fire once per
    # hour and poll 6 times inside the job at 10 minute intervals,
    # committing after each poll. Runner minutes are free on public repos.
    # GRT service hours are roughly 5am to 1am America/Toronto
    # (EDT = UTC-4 all collection window), i.e. 09:00-05:59 UTC.
    # Minute 23: an uncommon minute far from :00/:05/:15/:30 load
    # spikes (no cron fired at :05 on Jul 15 despite valid
    # registration; changed 03:45Z, which also forces GitHub to
    # re-register the schedule).
    - cron: "23 9-23 * * *"
    - cron: "23 0-5 * * *"
  workflow_dispatch: {}       # manual "Run workflow" button for testing

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      # Sparse checkout: the runner never downloads the growing data/raw
      # tree (write-once files the job doesn't read back). filter: blob:none
      # keeps the clone small as history grows.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !data/raw/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Poll six times at 10 minute intervals
        env:
          GRT_WRITE_CSV: "0"   # raw only; CSVs are rebuilt locally
        run: |
          git config user.name "grt-logger-bot"
          git config user.email "actions@users.noreply.github.com"
          ok_polls=0
          for i in 1 2 3 4 5 6; do
            echo "=== poll $i of 6 at $(date -u +'%H:%M:%S') UTC ==="
            rc=0
            python logger.py || rc=$?
            if [ "$rc" -eq 0 ]; then
              ok_polls=$((ok_polls+1))
            else
              echo "poll $i exit $rc (1=partial feeds, 2=nothing collected), continuing"
            fi
            git add --sparse data/
            if git diff --cached --quiet; then
              echo "no changes"
            else
              git commit -m "data: $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
              # Retry the push a few times; if it still fails, keep the
              # commit local and let the next poll's push carry it. A
              # transient race must not kill the remaining polls.
              pushed=no
              for attempt in 1 2 3; do
                # -X theirs: if a local push changed data/status.txt in
                # parallel, auto-resolve in favor of this job's version
                # (heartbeat is ephemeral, raw filenames never collide)
                if git pull --rebase -X theirs origin main && git push; then
                  pushed=yes
                  break
                fi
                echo "push attempt $attempt failed"
                git rebase --abort 2>/dev/null || true
                sleep 5
              done
              [ "$pushed" = yes ] || echo "push deferred to next poll"
            fi
            if [ "$i" -lt 6 ]; then sleep 540; fi
          done
          echo "polls with all feeds ok: $ok_polls/6"
          # Individual poll failures are tolerated, but an hour that
          # never collected a complete bus+LRT pair must show RED.
          if [ "$ok_polls" -eq 0 ]; then
            echo "::error::no poll collected a complete feed pair this hour"
            exit 1
          fi
